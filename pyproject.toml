[project]
name = "atlas-sql-br"
version = "0.1.0"
description = "AtlasSQL-BR: Brazilian Portuguese geospatial Text-to-SQL dataset and fine-tuning pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlflow>=3.12.0",
    "peft>=0.19.1",
    "polars>=1.40.1",
    "psutil>=7.2.2",
    "psycopg>=3.3.4",
    "psycopg2>=2.9.12",
    "psycopg2-binary>=2.9.12",
    "sqlglot>=30.9.0",
    "torch>=2.11.0",
    "transformers>=5.9.0",
    "accelerate>=1.0.0",
    "huggingface-hub>=0.30.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# AdamW 8-bit (adamw_bnb_8bit) is CUDA-only; install on the GPU box:
#   uv sync --extra cuda
cuda = ["bitsandbytes>=0.45.0"]
